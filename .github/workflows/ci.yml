name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build tests/RepoGuard.Tests/RepoGuard.Tests.csproj -c Release
      - run: dotnet run --project tests/RepoGuard.Tests -c Release --no-build
      - run: dotnet publish src/RepoGuard.Api -c Release --no-build -o publish
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: repoguard:test
