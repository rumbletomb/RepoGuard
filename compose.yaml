services:
  repoguard:
    build: .
    ports: ["8080:8080"]
    environment:
      REPOGUARD_DATA: /data/repoguard.json
    volumes:
      - repoguard-data:/data
      - ${REPOSITORY_ROOT:-./examples}:/repositories:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
volumes:
  repoguard-data:
